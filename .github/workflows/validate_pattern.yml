name: Pattern Validation (research)

# 연구 전용 — 삼중바닥/삼중천장 멀티TF 게이트 검증.
# 매매/DB 접근 없음(공개 시세만 수집). 결과는 로그 + 아티팩트.

on:
  workflow_dispatch:
  # 연구 브랜치 push로도 실행 — REST API(rate limit) 없이 git push만으로
  # 검증을 발화시키는 경로. master push에는 반응하지 않음.
  push:
    branches:
      - "claude/7day-trading-signals-2bk3yq"
    paths:
      - "validate_triple_pattern.py"
      - "detector_triple_bottom.py"
      - "detector_triple_top.py"
      - ".github/workflows/validate_pattern.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 연장 윈도(1d 1800d/4h 1100d/1h 365d) fetch 여유
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Run validation
        run: python validate_triple_pattern.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triple-pattern-results-${{ github.run_number }}
          path: _triple_pattern_results.json
          if-no-files-found: ignore
