name: Pattern Validation (research)

# 연구 전용 — 삼중바닥/삼중천장 멀티TF 게이트 검증.
# 매매/DB 접근 없음(공개 시세만 수집). 결과는 로그 + 아티팩트.

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Run validation
        run: python validate_triple_pattern.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triple-pattern-results-${{ github.run_number }}
          path: _triple_pattern_results.json
          if-no-files-found: ignore
