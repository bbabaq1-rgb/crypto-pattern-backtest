name: Diagnostic — OKX algo state of executed OCO (read-only)

# 일회성 진단(2026-10-29) — 이 브랜치 push 에서만 돈다. master 에 병합하지 않는다(같은 PR 에서 지운다).
# 왜: 15분 틱이 AI 엘리엇 OCO 익절 체결(14:1x~14:3x UTC)을 settle_by_algo 로 못 잡았다. exchange.algo_state 가
#     체결된 OCO 에 대해 OKX 에서 무엇을 받는지(state / actualPx / actualSide / ordIdList) 실측한다.
# 읽기 전용: OKX GET 조회만(algo 대기·이력, 체결 주문 상세). 주문·취소·DB 쓰기 없음.
on:
  push:
    branches:
      - "claude/7day-trading-signals-2bk3yq"
    paths:
      - ".github/workflows/diag_algo_state.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Read-only algo state probe
        env:
          OKX_KEY: ${{ secrets.OKX_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          python - <<'PY'
          import json
          import exchange as ex_mod

          lc = ex_mod.connect_live()
          if not lc:
              raise SystemExit("OKX 연결 실패")
          ex = lc["exchange"]
          # AI 엘리엇 BTC OCO 3건: 10/28 익절 / 10/29 01시 손절 / 10/29 오늘 익절
          ids = ["4049823953015644160", "4051038538460667904", "4051395198249181184"]
          keep = ("algoId", "instId", "ordType", "state", "actualPx", "actualSide", "actualSz",
                  "triggerTime", "tpTriggerPx", "tpOrdPx", "slTriggerPx", "slOrdPx", "ordId",
                  "ordIdList", "sz", "cTime", "uTime", "failCode")
          for aid in ids:
              print(f"=== algoId {aid}")
              found = []
              for path in ("privateGetTradeOrdersAlgoPending", "privateGetTradeOrdersAlgoHistory"):
                  for ot in ("oco", "conditional"):
                      try:
                          resp = getattr(ex, path)({"ordType": ot, "algoId": aid})
                          data = resp.get("data") or []
                          print(f"  {path} ordType={ot} code={resp.get('code')} n={len(data)}")
                          for o in data:
                              rec = {k: o.get(k) for k in keep}
                              print("   ", json.dumps(rec, ensure_ascii=False))
                              found.append(o)
                      except Exception as e:
                          print(f"  {path} ordType={ot} ERR {type(e).__name__}: {str(e)[:240]}")
              print("  algo_state() ->", ex_mod.algo_state(lc, aid))
              oids = []
              for o in found:
                  for oid in (o.get("ordIdList") or []) + ([o.get("ordId")] if o.get("ordId") else []):
                      if oid and oid not in oids:
                          oids.append(oid)
              for oid in oids:
                  inst = found[0].get("instId")
                  try:
                      r = ex.privateGetTradeOrder({"instId": inst, "ordId": oid})
                      for d in (r.get("data") or []):
                          print("  triggered order", json.dumps({k: d.get(k) for k in (
                              "ordId", "state", "ordType", "side", "avgPx", "fillPx", "accFillSz",
                              "px", "sz", "fillTime", "uTime", "algoId")}, ensure_ascii=False))
                  except Exception as e:
                      print(f"  order {oid} ERR {type(e).__name__}: {str(e)[:240]}")
          PY
