name: three_soldiers_4h cohort all to top30 (research, pre-registered R-003)

# 연구 전용 — 매매/DB 접근 없음, 실거래 규칙 무변경. 기준·판정은 validate_ts_top30.py 상단에 고정.
# DEPLOY_ON_PASS=True(backlog R-003) — PASSED 시 universe.json cohort 한 줄만.

on:
  workflow_dispatch:
  push:
    branches:
      - "research/R-003"
    paths:
      - "validate_ts_top30.py"
      - "validate_portfolio.py"
      - ".github/workflows/ts_top30.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Logic tests (no network)
        run: |
          python test_ts_top30.py
          python test_portfolio.py
      - name: Pre-registered test
        run: python validate_ts_top30.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-top30-${{ github.run_number }}
          path: _ts_top30.json
          if-no-files-found: ignore
