name: risk grid T7 (research, pre-registered R-086)

# 연구 전용 — 매매/DB 접근 없음. 분류 규칙은 validate_risk_grid_t7.py 상단에 고정. DEPLOY_ON_PASS=False.

on:
  workflow_dispatch:
  push:
    branches:
      - "research/R-086"
    paths:
      - "validate_risk_grid_t7.py"
      - "validate_risk_grid.py"
      - "validate_path_tail.py"
      - "validate_portfolio.py"
      - ".github/workflows/risk_grid_t7.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Logic tests (no network)
        run: |
          python test_risk_grid_t7.py
          python test_risk_grid.py
          python test_path_tail.py
          python test_gap.py
          python test_portfolio.py
      - name: Pre-registered test
        run: python validate_risk_grid_t7.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-grid-t7-${{ github.run_number }}
          path: _risk_grid_t7.json
          if-no-files-found: ignore
