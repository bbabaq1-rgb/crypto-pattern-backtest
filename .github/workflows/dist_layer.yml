name: Research — R-070 distribution layer (preregistered)

# R-070 분포 조건 층 제거 시험. 문턱 변경 없음.
# 사전 등록 registry dist_layer_prereg_2026_11_09. 매매·DB 무관.

on:
  workflow_dispatch:
  push:
    branches:
      - "research/R-070"
    paths:
      - "validate_dist_layer.py"
      - "audit_winrate.py"
      - "test_dist_layer.py"
      - ".github/workflows/dist_layer.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Pull long history (data-long branch → data_long/)
        run: |
          git fetch --depth=1 origin data-long
          git checkout origin/data-long -- data_long
          ls data_long | wc -l
      - name: Logic tests (no network)
        run: python test_dist_layer.py
      - name: Audit (win-rate gate layer)
        run: python validate_dist_layer.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-layer-result
          path: |
            dist_layer.json
            winrate_audit.json
          if-no-files-found: ignore
