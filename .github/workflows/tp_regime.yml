name: Research — take-profit barrier grid split by regime (pre-registered)

# 배리어 격자 27셀을 레짐(bull_btc/bull_altseason/bear/ALL)으로 분해. 무작위 베이스라인도 레짐 매칭. 사전 등록 registry tp_regime_prereg_2026_09_09. DEPLOY_ON_PASS=False.
# 매매·DB 무관.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/7day-trading-signals-2bk3yq"
    paths:
      - "validate_tp_regime.py"
      - "test_tp_regime.py"
      - ".github/workflows/tp_regime.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Pull long history (data-long branch → data_long/)
        run: |
          git fetch --depth=1 origin data-long
          git checkout origin/data-long -- data_long
          ls data_long | wc -l
      - name: Logic tests (no network)
        run: python test_tp_regime.py
      - name: Run
        run: python validate_tp_regime.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tp-regime-${{ github.run_number }}
          path: _tp_regime.json
          if-no-files-found: ignore
