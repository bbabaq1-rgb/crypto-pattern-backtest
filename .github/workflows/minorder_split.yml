name: R-124 최소주문 스킵 분리 (research)
# 계산 전용 — 매매/DB 접근 없음. registry minorder_split_prereg_2026_11_20
on:
  workflow_dispatch:
  push:
    branches: ["research/minorder_split"]
    paths: ["validate_minorder_split.py", "validate_killswitch.py", "validate_risk_equity.py", "validate_gap.py", "validate_portfolio.py", ".github/workflows/minorder_split.yml"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - run: python test_killswitch.py
      - run: python test_risk_equity.py
      - run: python test_minorder_split.py
      - run: python test_portfolio.py
      - run: python test_gap.py
      - run: python validate_minorder_split.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: minorder_split, path: _minorder_split.json, if-no-files-found: ignore}
