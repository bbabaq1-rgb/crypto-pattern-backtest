name: R-118 killswitch reach probability (research)
# 계산 전용 — 매매/DB 접근 없음. registry killswitch_prereg_2026_11_17
on:
  workflow_dispatch:
  push:
    branches: ["research/killswitch_R118"]
    paths: ["validate_killswitch.py", "validate_gap.py", "validate_portfolio.py", ".github/workflows/killswitch.yml"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - run: python test_killswitch.py
      - run: python test_portfolio.py
      - run: python test_gap.py
      - run: python validate_killswitch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: killswitch, path: _killswitch.json, if-no-files-found: ignore}
