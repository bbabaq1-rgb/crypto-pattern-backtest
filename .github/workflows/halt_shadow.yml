name: halt shadow replay vs prior ledger distribution (research, pre-registered R-114)

# 연구 전용 — trades 를 select 만 한다. 기준은 validate_halt_shadow.py 상단과 registry halt_shadow_prereg_2026_11_15. DEPLOY_ON_PASS=False.

on:
  workflow_dispatch:
  push:
    branches:
      - "research/R-114"
    paths:
      - "validate_halt_shadow.py"
      - "steward.py"
      - "validate_ledger_recent.py"
      - "validate_portfolio.py"
      - ".github/workflows/halt_shadow.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Logic tests (no network)
        run: python test_halt_shadow.py
      - name: Pre-registered test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python validate_halt_shadow.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halt-shadow-${{ github.run_number }}
          path: _halt_shadow.json
          if-no-files-found: ignore
