name: Regime Scale Study (research)

# 연구 전용 — 주단위/일단위/시간단위 레짐을 진입 필터·청산 레짐 소스로 얹었을 때
# 방식D·방식R 이 달라지는가. 매매/DB 접근 없음(공개 시세만 수집). 결과는 로그 + 아티팩트.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/7day-trading-signals-2bk3yq"
    paths:
      - "method_m.py"
      - "regime_multi.py"
      - "test_method_m.py"
      - ".github/workflows/method_m.yml"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Logic tests (no network)
        run: |
          python test_method_t.py
          python test_method_r.py
          python test_method_m.py
      - name: Run regime scale study
        run: python method_m.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: method-m-${{ github.run_number }}
          path: method_m.json
          if-no-files-found: ignore
