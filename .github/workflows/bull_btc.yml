name: bull_btc regime long pause (research, pre-registered R-060)

# 연구 전용 — 매매/DB 접근 없음. 기준·판정은 validate_bull_btc.py 상단에 고정.
# DEPLOY_ON_PASS=True(backlog R-060) — PASSED 이고 경계값 아닐 때만 별도 PR 로 반영.

on:
  workflow_dispatch:
  push:
    branches:
      - "research/R-060"
    paths:
      - "validate_bull_btc.py"
      - "validate_portfolio.py"
      - ".github/workflows/bull_btc.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Logic tests (no network)
        run: |
          python test_bull_btc.py
          python test_portfolio.py
      - name: Pre-registered test
        run: python validate_bull_btc.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bull-btc-${{ github.run_number }}
          path: _bull_btc.json
          if-no-files-found: ignore
