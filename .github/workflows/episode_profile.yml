name: Research — bull-episode winner profile (pre-registered, descriptive)

# 상승 국면(레짐 에피소드) 안에서 '많이 오른 코인 vs 안 오른 코인'의 시작 시점 상태 변수(35종) 프로필.
# 유니버스 80 이 아니라 data-long 브랜치의 전 코인(OKX 무기한 전 종목 장기 이력). 사전 등록 registry
# episode_profile_prereg_2026_09_07. DEPLOY_ON_PASS=False — 매매·DB 무관.
# 데이터: data-long 브랜치 build run 34088487916 (OKX 무기한 전 종목, 2026-09-07).

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/7day-trading-signals-2bk3yq"
    paths:
      - "validate_episode_profile.py"
      - "test_episode_profile.py"
      - ".github/workflows/episode_profile.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Pull long history (data-long branch → data_long/)
        run: |
          git fetch --depth=1 origin data-long
          git checkout origin/data-long -- data_long
          ls data_long | wc -l
      - name: Logic tests (no network)
        run: |
          python test_xsec_chars.py
          python test_episode_profile.py
      - name: Validate (episode profile, data_long only)
        run: python validate_episode_profile.py --data-long-only
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-profile-${{ github.run_number }}
          path: _episode_profile.json
          if-no-files-found: ignore
