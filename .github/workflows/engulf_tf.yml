name: Research — engulfing on 1h/4h/1w, current frame (pre-registered)

# engulfing 을 1h/4h/1w 에서 현행 프레임(게이트 v2 + k=n 베이스라인 + 실거래 청산 +
# PIT 코호트 + 홀드아웃 + 자산곡선)으로 재시험. 4h 는 2026-06-24 구 게이트 탈락 이후
# 재시험된 적이 없고 1w 는 한 번도 안 돌렸다.
# 사전 등록 registry engulf_tf_prereg_2026_09_09. DEPLOY_ON_PASS=False — 매매·DB 무관.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/7day-trading-signals-2bk3yq"
    paths:
      - "validate_engulf_tf.py"
      - "test_engulf_tf.py"
      - ".github/workflows/engulf_tf.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Pull long history (data-long branch → data_long/)
        run: |
          git fetch --depth=1 origin data-long
          git checkout origin/data-long -- data_long
          ls data_long | wc -l
      - name: Logic tests (no network)
        run: python test_engulf_tf.py
      - name: Validate (engulfing 1h/4h/1w)
        run: python validate_engulf_tf.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engulf-tf-${{ github.run_number }}
          path: _engulf_tf.json
          if-no-files-found: ignore
