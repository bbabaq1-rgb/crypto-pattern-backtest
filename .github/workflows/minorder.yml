name: R-107 minimum-order pass rate (research)
# 계산 전용 — 매매/DB 접근 없음. registry minorder_prereg_2026_11_11
on:
  workflow_dispatch:
  push:
    branches: ["research/minorder_R107"]
    paths: ["validate_minorder.py", ".github/workflows/minorder.yml"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - run: python test_minorder.py
      - run: python validate_minorder.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: minorder, path: _minorder.json, if-no-files-found: ignore}
