name: D_close in portfolio slot-contention frame (research, pre-registered R-021)

# 연구 전용 — 매매/DB 접근 없음, 실거래 규칙 무변경. 기준·판정은 validate_dclose_port.py 상단에 고정.
# DEPLOY_ON_PASS=False — 통과해도 실거래 청산 변경은 사용자 보고 후.

on:
  workflow_dispatch:
  push:
    branches:
      - "research/R-021"
    paths:
      - "validate_dclose_port.py"
      - "test_dclose_port.py"
      - "validate_portfolio.py"
      - "sizing_vol.py"
      - ".github/workflows/dclose_port.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Logic tests (no network)
        run: |
          python test_dclose_port.py
          python test_portfolio.py
      - name: Pre-registered test (1d 1800d + 4h 1100d, paired boot 300)
        run: python validate_dclose_port.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dclose-port-${{ github.run_number }}
          path: _dclose_port.json
          if-no-files-found: ignore
