name: three_soldiers_4h holdout phase stratification (research, pre-registered R-030)

# 연구 전용 — 매매/DB 접근 없음, 실거래 규칙 무변경. 기준·판정은 validate_ts_phase.py 상단에 고정.
# DEPLOY_ON_PASS=False.

on:
  workflow_dispatch:
  push:
    branches:
      - "research/R-030"
    paths:
      - "validate_ts_phase.py"
      - "validate_portfolio.py"
      - ".github/workflows/ts_phase.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Logic tests (no network)
        run: |
          python test_ts_phase.py
          python test_portfolio.py
      - name: Pre-registered test
        run: python validate_ts_phase.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-phase-${{ github.run_number }}
          path: _ts_phase.json
          if-no-files-found: ignore
