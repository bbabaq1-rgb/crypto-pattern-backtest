name: Diagnostic — actual fills of engine market closes (read-only)

# 일회성 진단(2026-10-29) — 이 브랜치 push 에서만 돈다. master 에 병합하지 않는다(같은 PR 에서 지운다).
# 왜: AI 엘리엇 조기 청산(17:09Z)이 장부에 '@ 81240.0' = 직전 1시간봉 종가로 기록됐다. exchange.close_swap_position 이
#     시장가 주문 응답의 average 만 보는데 OKX 주문 응답에는 체결가가 없어(진입 경로는 2026-09-03 에 재조회로 고침)
#     늘 None → 호출부가 봉 가격으로 대신 적는다고 본다. 엔진 시장가 청산(maxhold·atr_target 등)의 실제 체결가를
#     장부 값과 대조하고, ccxt fetch_order 가 average 를 주는지(수정에 쓸 호출) 확인한다.
# 읽기 전용: OKX GET 조회만(주문 이력·주문 상세). 주문·취소·DB 쓰기 없음.
on:
  push:
    branches:
      - "claude/7day-trading-signals-2bk3yq"
    paths:
      - ".github/workflows/diag_close_fill.yml"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Read-only close fill probe
        env:
          OKX_KEY: ${{ secrets.OKX_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          python - <<'PY'
          import json, time
          from datetime import datetime, timezone
          import exchange as ex_mod

          lc = ex_mod.connect_live()
          if not lc:
              raise SystemExit("OKX 연결 실패")
          ex = lc["exchange"]

          def ms(s):
              return int(datetime.fromisoformat(s).replace(tzinfo=timezone.utc).timestamp() * 1000)

          def utc(t):
              try:
                  return datetime.fromtimestamp(int(t) / 1000, tz=timezone.utc).strftime("%m-%d %H:%M:%S")
              except Exception:
                  return str(t)

          # (심볼, 장부 기록 시각 UTC = trades.created_at, 장부 청산가, 사유) — Supabase trades 에서 옮김
          targets = [
              ("BTC",  "2026-10-29T17:09:26", 81240.0,   "ai_close"),
              ("LTC",  "2026-10-28T16:06:08", 58.37,     "maxhold"),
              ("TRX",  "2026-10-22T12:04:51", 0.33043,   "maxhold"),
              ("SOL",  "2026-10-21T19:08:42", 108.8881,  "atr_target(tp1)"),
              ("ETH",  "2026-10-21T15:09:15", 2496.8,    "atr_target(tp1)"),
              ("BCH",  "2026-10-20T16:05:47", 276.7,     "maxhold"),
              ("INJ",  "2026-10-20T16:05:47", 8.597,     "maxhold"),
              ("CRV",  "2026-10-20T12:06:01", 0.3674,    "maxhold"),
              ("OKB",  "2026-10-20T04:04:58", 114.97,    "maxhold"),
              ("SOL",  "2026-10-18T16:05:55", 102.16,    "maxhold"),
          ]
          keep = ("ordId", "side", "posSide", "ordType", "reduceOnly", "state", "avgPx", "accFillSz", "sz",
                  "fillTime", "cTime", "algoId", "source")
          now_ms = int(time.time() * 1000)
          probe_ids = []
          for sym, when, rec_px, why in targets:
              inst = f"{sym}-USDT-SWAP"
              t = ms(when)
              q = {"instType": "SWAP", "instId": inst, "begin": str(t - 20 * 60 * 1000), "end": str(t + 5 * 60 * 1000),
                   "limit": "100"}
              path = ("privateGetTradeOrdersHistory" if now_ms - t < 6.5 * 86400 * 1000
                      else "privateGetTradeOrdersHistoryArchive")
              print(f"=== {sym} {when}Z 장부 {rec_px} ({why}) — {path}")
              try:
                  data = getattr(ex, path)(q).get("data") or []
              except Exception as e:
                  print(f"  ERR {type(e).__name__}: {str(e)[:240]}")
                  continue
              hits = [d for d in data if str(d.get("reduceOnly")).lower() == "true"]
              if not hits:
                  print(f"  reduceOnly 주문 없음 (전체 {len(data)}건)")
                  for d in data:
                      print("   ", json.dumps({k: d.get(k) for k in keep}, ensure_ascii=False))
              for d in hits:
                  rec = {k: d.get(k) for k in keep}
                  rec["cTime"] = utc(rec.get("cTime")); rec["fillTime"] = utc(rec.get("fillTime"))
                  avg = float(d.get("avgPx") or 0)
                  diff = (avg / rec_px - 1) * 100 if avg and rec_px else None
                  print("   ", json.dumps(rec, ensure_ascii=False),
                        f"| 체결 {avg} vs 장부 {rec_px} → {diff:+.3f}%" if diff is not None else "")
                  if d.get("ordType") == "market" and len(probe_ids) < 3:
                      probe_ids.append((sym, d.get("ordId")))

          # 현재 실포지션·대기 algo(장부 대조용) — ETH/SOL/XRP/BTC
          for sym in ("ETH", "SOL", "XRP", "BTC"):
              try:
                  ps = ex.fetch_positions([f"{sym}/USDT:USDT"])
                  for p in ps:
                      print(f"position {sym} side={p.get('side')} contracts={p.get('contracts')} "
                            f"entry={p.get('entryPrice')} notional={p.get('notional')}")
                  if not ps:
                      print(f"position {sym} 없음")
              except Exception as e:
                  print(f"position {sym} ERR {type(e).__name__}: {str(e)[:200]}")
              for ot in ("oco", "conditional"):
                  try:
                      d = ex.privateGetTradeOrdersAlgoPending({"ordType": ot, "instId": f"{sym}-USDT-SWAP"}).get("data") or []
                      for o in d:
                          print(f"  pending {ot} {sym} algoId={o.get('algoId')} sz={o.get('sz')} side={o.get('side')} "
                                f"sl={o.get('slTriggerPx')} tp={o.get('tpTriggerPx')} cTime={utc(o.get('cTime'))}")
                  except Exception as e:
                      print(f"  pending {ot} {sym} ERR {type(e).__name__}: {str(e)[:160]}")
          # SOL 10-21 ~ 지금 주문 이력 전부(장부 3.33 vs 실포지션 2.3 차이 추적)
          for path, t0, t1 in (("privateGetTradeOrdersHistoryArchive", "2026-10-21T00:00:00", "2026-10-23T00:00:00"),
                               ("privateGetTradeOrdersHistory", "2026-10-23T00:00:00", "2026-10-29T23:59:00")):
              try:
                  d = getattr(ex, path)({"instType": "SWAP", "instId": "SOL-USDT-SWAP", "begin": str(ms(t0)),
                                         "end": str(ms(t1)), "limit": "100"}).get("data") or []
                  for o in sorted(d, key=lambda x: int(x.get("cTime") or 0)):
                      print("  SOL", json.dumps({k: (utc(o.get(k)) if k in ("cTime", "fillTime") else o.get(k))
                                                 for k in keep}, ensure_ascii=False))
              except Exception as e:
                  print(f"  SOL {path} ERR {type(e).__name__}: {str(e)[:200]}")

          # 수정에 쓸 호출: ccxt fetch_order 가 average·filled 를 채우는지
          for sym, oid in probe_ids:
              try:
                  od = ex.fetch_order(oid, f"{sym}/USDT:USDT")
                  print(f"fetch_order {sym} {oid} -> average={od.get('average')} filled={od.get('filled')} "
                        f"status={od.get('status')} price={od.get('price')}")
              except Exception as e:
                  print(f"fetch_order {sym} {oid} ERR {type(e).__name__}: {str(e)[:240]}")
          PY
