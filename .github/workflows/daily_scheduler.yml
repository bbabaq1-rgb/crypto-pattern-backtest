name: Crypto Pattern Scheduler

# 발화는 **외부 트리거 전용** — Supabase pg_cron 이 UTC 00/04/08/12/16/20 정각에
# workflow_dispatch 로 깨운다(supabase_external_trigger.sql). 00시=oncefull, 나머지=oncequick.
# 이 워크플로는 **항상 --slow** 로 돌아 1d/4h/1w + 1h 일반 패턴 전체를 탐지한다.
# 실행 시각으로 틱을 추정하지 않는다 — 큐 지연으로 정각을 넘긴 실행이 느린틱으로
# 인식되지 않던 회귀(2026-09-02)를 막기 위해 워크플로가 모드를 명시한다.
#
# GitHub schedule 폴백 제거 (2026-09-06, 사용자 결정 "폴백 제거해줘"):
#   4h 크론은 7/02~9/01 두 달간 발화율 99% 였으나 9/05~9/06 에 **5회 연속 지각**했다
#   (00:00 크론이 02:19 발화 등, 25분~2시간 19분). 지각한 폴백은 외부 트리거가 이미
#   돈 같은 느린틱을 다시 돌리고(중복 방어 키가 봉 ts 라 주문은 0건), 더 나쁘게는
#   같은 concurrency 그룹에 큐로 들어와 **대기 중이던 실행을 취소**시킬 수 있다
#   (GitHub 는 cancel-in-progress: false 여도 pending 을 취소한다 — fast 쪽에서 실측).
#   외부 트리거는 9/02 전환 후 정시 100% 발화 중이라 폴백의 기대값이 음수가 됐다.
#   **대가**: 이제 발화 경로가 하나뿐이다. 외부 트리거가 멈추면(PAT 만료 → 로그 401,
#   Supabase 프로젝트 일시정지) 아무것도 돌지 않는다 — 진입·청산·손절 점검 전부.
#   감지는 gh_dispatch_log 와 실행 이력 점검에 의존하고, 복구는 수동 dispatch 다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'oncefull / oncequick'
        required: false
        default: 'oncefull'

# 중첩 실행 차단: 진행 중이면 새 실행은 대기 (진행 중인 건 완주)
concurrency:
  group: scheduler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 정상 실행 ~3-5분 기준 — 초과는 확실한 이상 상황
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Run scheduler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OKX_KEY: ${{ secrets.OKX_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # workflow_dispatch 수동 실행 시 mode 입력 우선
          MANUAL_MODE="${{ github.event.inputs.mode }}"
          if [ -n "$MANUAL_MODE" ]; then
            MODE="$MANUAL_MODE"
          else
            HOUR=$(date -u +%H | sed 's/^0//')
            if [ "$HOUR" = "0" ] || [ -z "$HOUR" ]; then
              MODE="oncefull"
            else
              MODE="oncequick"
            fi
          fi
          echo "실행 모드: $MODE --slow (UTC $(date -u +%H:%M))"
          python scheduler.py "$MODE" --slow

      - name: Upload result JSONs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-results-${{ github.run_number }}
          path: |
            signals_today.json
            paper_positions.json
            paper_trades.json
            direction_switch.json
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-logs-${{ github.run_number }}
          path: |
            *.json
            scheduler_log.txt
          if-no-files-found: ignore
