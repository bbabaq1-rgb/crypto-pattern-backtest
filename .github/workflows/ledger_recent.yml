name: ledger recent vs prior distribution (research, pre-registered R-105)

# 연구 전용 — trades 를 select 만 한다. 기준은 validate_ledger_recent.py 상단과 registry ledger_recent_prereg_2026_11_14. DEPLOY_ON_PASS=False.

on:
  workflow_dispatch:
  push:
    branches:
      - "research/R-105"
    paths:
      - "validate_ledger_recent.py"
      - "steward.py"
      - ".github/workflows/ledger_recent.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Logic tests (no network)
        run: python test_ledger_recent.py
      - name: Pre-registered test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python validate_ledger_recent.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-recent-${{ github.run_number }}
          path: _ledger_recent.json
          if-no-files-found: ignore
