name: R-120 risk x equity killswitch (research)
# 계산 전용 — 매매/DB 접근 없음. registry risk_equity_prereg_2026_11_18
on:
  workflow_dispatch:
  push:
    branches: ["research/R-120"]
    paths: ["validate_risk_equity.py", "validate_killswitch.py", "validate_gap.py", "validate_portfolio.py", ".github/workflows/risk_equity.yml"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - run: python test_killswitch.py
      - run: python test_risk_equity.py
      - run: python test_portfolio.py
      - run: python test_gap.py
      - run: python validate_risk_equity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: risk_equity, path: _risk_equity.json, if-no-files-found: ignore}
