name: Research — tp1 max_open x replace-on-profit (diagnostic)

# tp1_engulfing_1h 의 동시 포지션 수(max_open 1/2/3)와 '수익 중이면 교체' 규칙
# (사용자 지시 2026-09-21). 실거래 규칙(익절 1%·손절 8%·3x·포트 바닥 $70·top20)은 그대로 두고
# 슬롯 수와 교체 규칙만 바꾼다. 증거금은 실거래처럼 진입마다 포트 전액(full)이라 슬롯이 늘면
# 노출도 같이 는다 — 노출 정합 진단 arm(split)을 함께 돌려 두 효과를 가른다.
# 진단 — DEPLOY_ON_PASS=False, 변경은 사용자 결정. 매매·DB 무관.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/7day-trading-signals-2bk3yq"
    paths:
      - "validate_tp1_slots.py"
      - "test_tp1_slots.py"
      - ".github/workflows/tp1_slots.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Logic tests (no network)
        run: python test_tp1_slots.py
      - name: Slot x replace grid (1h fetch + 48 cells x 2 cohorts)
        run: python validate_tp1_slots.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tp1-slots-${{ github.run_number }}
          path: _tp1_slots.json
          if-no-files-found: ignore
