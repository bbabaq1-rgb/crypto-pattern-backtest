name: Take-Profit Arm (research)

# 연구 전용 — 방식D(익절 없음) vs 방식T(k) 고정 익절 10/15/20/25/30% 비교.
# 매매/DB 접근 없음(공개 시세만 수집). 결과는 로그 + 아티팩트.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/7day-trading-signals-2bk3yq"
    paths:
      - "method_t.py"
      - "test_method_t.py"
      - ".github/workflows/method_t.yml"

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 1d 1,800일 x 7종목 + 패턴 7종 x arm 6개
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Logic tests (no network)
        run: python test_method_t.py

      - name: Run take-profit comparison
        run: python method_t.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: method-t-${{ github.run_number }}
          path: method_t.json
          if-no-files-found: ignore
