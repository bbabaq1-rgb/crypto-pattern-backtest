name: Research — R-001 lottery gate (preregistered)

# R-001 승률 조건 → 복권형 지표 대체 시험. 문턱 변경 없음.
# 사전 등록 registry lottery_gate_prereg_2026_10_26. 매매·DB 무관.

on:
  workflow_dispatch:
  push:
    branches:
      - "research/R-001"
    paths:
      - "validate_lottery_gate.py"
      - "audit_winrate.py"
      - "test_lottery_gate.py"
      - ".github/workflows/lottery_gate.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Create data directory
        run: mkdir -p data
      - name: Pull long history (data-long branch → data_long/)
        run: |
          git fetch --depth=1 origin data-long
          git checkout origin/data-long -- data_long
          ls data_long | wc -l
      - name: Logic tests (no network)
        run: python test_lottery_gate.py
      - name: Audit (win-rate gate layer)
        run: python validate_lottery_gate.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lottery-gate-result
          path: |
            lottery_gate.json
            winrate_audit.json
          if-no-files-found: ignore
