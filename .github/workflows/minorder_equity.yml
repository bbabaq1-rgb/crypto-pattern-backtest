name: R-109 minimum-order equity frame (research)
# 계산 전용 — 매매/DB 접근 없음. registry minorder_equity_prereg_2026_11_16
on:
  workflow_dispatch:
  push:
    branches: ["research/minorder_R109"]
    paths: ["validate_minorder_equity.py", "validate_portfolio.py", ".github/workflows/minorder_equity.yml"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - run: python test_minorder_equity.py
      - run: python test_portfolio.py
      - run: python validate_minorder_equity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: minorder, path: _minorder_equity.json, if-no-files-found: ignore}
