name: R-108 minimum-order pass rate 4h (research)
# 계산 전용 — 매매/DB 접근 없음. registry minorder4h_prereg_2026_11_12
on:
  workflow_dispatch:
  push:
    branches: ["research/minorder4h_R108"]
    paths: ["validate_minorder4h.py", ".github/workflows/minorder4h.yml"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - run: python test_minorder4h.py
      - run: python validate_minorder4h.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: minorder4h, path: _minorder4h.json, if-no-files-found: ignore}
