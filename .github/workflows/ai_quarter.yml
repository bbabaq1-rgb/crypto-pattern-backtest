name: AI Elliott entry check (15m)

# AI 엘리엇 BTC 15분 진입 판단 — 2026-10-29 사용자 지시 "진입판단을 15분마다 변경하는걸로 1주일만 테스트해보자
# 1주일 후에 계속할지 중단할지 나한테 다시 물어봐줘".
#
# 발화는 외부 트리거 전용(Supabase pg_cron → workflow_dispatch, 매시 :18/:33/:48 — gh_ai_quarter).
# 매시 :03 판단은 fast_scheduler.yml 이 그대로 맡는다. 합치면 15분마다 한 번씩이다.
#
# 하는 일: AI 엘리엇이 평탄일 때만 진입 판단 1회(paper_executor.py aitick = run(ai_only=True)). 보유 중이면 자기 OCO 가
# 집행됐는지만 확인한다(보유 판단 hold/close 는 매시 :03). 메인 전략의 탐지·청산 평가·손절 점검은 여기서 돌지 않는다.
# 시험 기간(universe.json ai_traders[].entry_check.until)이 지나면 게이트에서 바로 끝난다 — 크론을 지우지 않아도 멈춘다.
on:
  workflow_dispatch:

# 메인 스케줄러(scheduler-*)와 **다른 그룹**이다. 같은 그룹이면 이 실행이 큐에 들어오는 순간 대기 중이던 메인 실행이
# 취소될 수 있다(GitHub 는 같은 그룹의 pending 을 새 실행으로 바꾼다 — fast_scheduler.yml 주석의 2026-09-02 실측).
# 대신 첫 단계 게이트가 메인 실행이 돌고 있거나 대기 중이면 건너뛰어, 같은 DB·같은 계좌를 동시에 만지지 않게 한다.
concurrency:
  group: ai-quarter-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 9분: :48 실행도 :57 전에 끝난다 — 다음 메인 실행(:00 daily / :03 fast)과 겹치지 않는다.
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 게이트 — 하나라도 걸리면 아무것도 하지 않고 끝난다(의존성 설치 전이라 몇 초).
      #   ① 시각: UTC 분이 14~52 밖이면 메인 실행 창(:53~:13)에 걸린다 → 건너뜀
      #   ② 시험 기간: ai_elliott.entry_check_active() 가 False(종료일 경과·설정 없음) → 건너뜀
      #   ③ 메인 스케줄러(daily/fast) 실행이 진행 중이거나 대기 중 → 건너뜀. 조회 실패도 건너뜀(fail-closed)
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$((10#$(date -u +%M)))
          if [ "$m" -lt 14 ] || [ "$m" -gt 52 ]; then
            echo "UTC :$m — 메인 실행 창(:53~:13) → 건너뜀"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! python3 -c "import sys, ai_elliott as a; sys.exit(0 if a.entry_check_active() else 1)"; then
            echo "15분 진입 판단 꺼짐(시험 기간 종료 또는 설정 없음) → 건너뜀"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          busy=0
          for wf in daily_scheduler.yml fast_scheduler.yml; do
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --limit 10 --json status \
                  --jq '[.[] | select(.status != "completed")] | length') || n=""
            if [ -z "$n" ]; then
              echo "$wf 실행 상태 조회 실패 → 건너뜀(fail-closed)"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
            fi
            busy=$((busy + n))
          done
          if [ "$busy" -gt 0 ]; then
            echo "메인 스케줄러 실행 중·대기 ${busy}건 → 건너뜀"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.11
        if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        if: steps.gate.outputs.go == 'yes'
        run: pip install -r requirements.txt

      - name: Create data directory
        if: steps.gate.outputs.go == 'yes'
        run: mkdir -p data

      - name: AI entry check
        if: steps.gate.outputs.go == 'yes'
        timeout-minutes: 6
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OKX_KEY: ${{ secrets.OKX_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "실행 모드: aitick (UTC $(date -u +%H:%M))"
          python paper_executor.py aitick
